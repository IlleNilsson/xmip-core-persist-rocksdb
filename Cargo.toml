# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-persist-rocksdb"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-persist-rocksdb"
description = "The runtime store: RocksDB holding persist's sealed records. A xmip-core-persist technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent, never the reverse (repository-model.md).
# The Engine trait, the error and the encryption above it live there; this
# crate only keeps bytes under bytes.
persist = { package = "xmip-core-persist", git = "https://github.com/IlleNilsson/xmip-core-persist", branch = "main" }
# The engine the owner chose for the runtime store (ADR-0015, amendment
# 2026-09-25). C++, compiled by the crate's build script with the platform's
# C++ compiler, and bound through bindgen, which needs libclang at build time
# (prerequisite.toml, cpp). No compression: every value is ciphertext, which
# does not compress, and each codec is a C library more to build.
rocksdb = { version = "0.25", default-features = false, features = ["bindgen-runtime"] }

[dev-dependencies]
# The checks every engine passes, run from persist's `fixture` module, sealing
# under a key-encryption key held in memory rather than the machine's own key
# store; the feature is enabled here so it is never part of a production build.
persist = { package = "xmip-core-persist", git = "https://github.com/IlleNilsson/xmip-core-persist", branch = "main", features = ["test-support"] }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
